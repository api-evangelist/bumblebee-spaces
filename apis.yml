name: Bumblebee Spaces
description: Bumblebee Spaces is a San Francisco smart-home robotics company that builds app-controlled
  motorized storage systems for compact urban living. Its ceiling-mounted robotic units lift beds, closets,
  and storage bins up and out of the way, reclaiming floor space in small apartments, while a built-in
  camera and mobile app track and retrieve stored belongings on demand. The company sells and installs
  hardware plus a companion consumer mobile application; it does not currently publish a public developer
  API, SDK, or developer portal. Backed by Bloomberg Beta and Canaan Partners, the profile is tracked in
  the API Evangelist network as a portfolio lead.
